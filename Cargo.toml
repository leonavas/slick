[package]
name = "slick"
version = "0.1.3"
edition = "2021"
description = "Cliente Slack leve para terminal"
license = "Apache-2.0"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
emojis = "0.6"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Slack's real-time websocket (`rtm`), over the rustls ureq already brings.
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# The tray icon: StatusNotifierItem over zbus (pure Rust, no libdbus), driven
# from a thread by a single-threaded tokio runtime; fewer crates than async-io.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

# The sign-in window (`login_window`), WebView2 on Windows. On Linux it's the
# `slick-login` helper in login/, built by build.rs and carried inside slick,
# so slick starts without WebKitGTK.
[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = "0.57"
tao = "0.37"
# Pasted images (`attach`); Linux shells out to wl-paste or xclip instead.
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Its own workspace, also when checked out inside another (worktrees).
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
